networks:
  invisionu-ats-network:
    driver: bridge

services:
  scraper:
    build:
      context: ./TalantParser/TalantParser
      dockerfile: Dockerfile
    ports:
      - "${SCRAPER_HOST_PORT:-9432}:9432"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9432/health"]
      interval: 30s
      timeout: 10s
      retries: 4
    restart: unless-stopped
    networks:
      - invisionu-ats-network
