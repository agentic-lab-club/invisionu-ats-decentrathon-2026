networks:
  invisionu-ats-network:
    driver: bridge

volumes:
  chroma_data:

services:
  app:
    build:
      context: ./tg_bot_rag/KazRAGUNIProject
      dockerfile: Dockerfile
    container_name: rag-app
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CHROMA_URL=http://chroma:8000
    depends_on:
      chroma:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  chroma:
    image: ghcr.io/chroma-core/chroma:latest
    container_name: chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "chroma", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  telegram-bot:
    build:
      context: ./tg_bot_rag/KazRAGUNIProject
      dockerfile: Dockerfile
    container_name: rag-telegram-bot
    command: ["python", "telegram_bot.py"]
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - RAG_INVOKE_URL=http://app:8000/rag/invoke
      - RAG_TIMEOUT_SECONDS=60
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
