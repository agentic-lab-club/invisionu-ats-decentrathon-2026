networks:
  invisionu-ats-network:
    driver: bridge

volumes:
  chroma_data:

services:
  rag-app:
    build:
      context: ./tg_bot_rag/KazRAGUNIProject
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CHROMA_URL: ${CHROMA_URL:-http://chroma:8000}
    depends_on:
      chroma:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - invisionu-ats-network

  chroma:
    image: ghcr.io/chroma-core/chroma:latest
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "chroma", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - invisionu-ats-network

  telegram-bot:
    build:
      context: ./tg_bot_rag/KazRAGUNIProject
      dockerfile: Dockerfile
    command: ["python", "telegram_bot.py"]
    env_file:
      - .env
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      RAG_INVOKE_URL: ${RAG_INVOKE_URL:-http://rag-app:8000/rag/invoke}
      RAG_TIMEOUT_SECONDS: ${RAG_TIMEOUT_SECONDS:-60}
    depends_on:
      rag-app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - invisionu-ats-network
