networks:
  invisionu-ats-network:
    driver: bridge

volumes:
  postgres_data:

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: invisionu_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - invisionu-ats-network

  postgres:
    image: postgres:17-alpine
    container_name: invisionu_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    networks:
      - invisionu-ats-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    container_name: invisionu_backend
    env_file:
      - .env
    ports:
      - "8080:8080"
    restart: unless-stopped
    command: ["-config=prod"]
    volumes:
      - ./backend/config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      llmscoring:
        condition: service_started
      sttwhisper:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - invisionu-ats-network

  llmscoring:
    build:
      context: ./llm
      dockerfile: Dockerfile
    container_name: invisionu_llscoring
    ports:
      - "9094:9094"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9094/docs >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - invisionu-ats-network

  sttwhisper:
    build:
      context: ./STT
      dockerfile: Dockerfile
    container_name: invisionu_sttwhisper
    ports:
      - "9095:9095"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9095/docs >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - invisionu-ats-network

  aidetect:
    build:
      context: ./AI_Detecter-service
      dockerfile: Dockerfile
    container_name: invisionu_aidetect
    ports:
      - "9873:9873"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9873/health"]
      interval: 30s
      timeout: 10s
      retries: 4
    restart: unless-stopped
    networks:
      - invisionu-ats-network
