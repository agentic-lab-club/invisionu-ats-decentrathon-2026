networks:
  invisionu-ats-network:
    driver: bridge

volumes:
  postgres_data:

services:
  frontend:
    build:
      context: .
      dockerfile: /frontend/Dockerfile
    container_name: invisionu_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    networks:
      - invisionu-ats-network

  postgres:
    image: postgres:17-alpine
    container_name: invisionu_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    networks:
      - invisionu-ats-network

  golang:
    build:
      context: .
      dockerfile: /backend/Dockerfile
    container_name: invisionu_backend
    env_file:
      - .env
    ports:
      - "8080:8080"
    restart: unless-stopped
    command: ["-config=local"]
    volumes:
      - ./config:/app/config:ro
    networks:
      - invisionu-ats-network

